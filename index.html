<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>楽譜プレイヤー</title>
  <style>
    :root {
      --bg:         #0E0E18;
      --surface:    #181826;
      --surface-2:  #222236;
      --border:     #2E2E4A;
      --text:       #EEEEFF;
      --text-muted: #8888AA;
      --accent:     #7C6AFC;
      --accent-dim: rgba(124,106,252,0.18);
      --accent-glow:rgba(124,106,252,0.35);
      --safe-top:   env(safe-area-inset-top, 0px);
      --safe-bot:   env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
    }
    button { cursor: pointer; font: inherit; border: none; background: none; color: inherit; }
    input[type="range"] { cursor: pointer; accent-color: var(--accent); }
    select { font: inherit; cursor: pointer; }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
      overflow: hidden;
    }
    .screen[hidden] { display: none; }

    /* Error banner */
    #error-banner {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 12px; right: 12px;
      background: #3A1010;
      border: 1px solid #E85454;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      z-index: 100;
      font-size: 13px;
      color: #FFB0B0;
    }
    #error-banner[hidden] { display: none; }
    #error-msg { flex: 1; line-height: 1.5; }
    #btn-error-close { font-size: 18px; color: #FF8888; flex-shrink: 0; margin-top: -1px; }

    /* HOME */
    #screen-home { background: #000; }
    #camera-video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
    #camera-canvas { display: none; }

    .camera-hint {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }

    .capture-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 16px 32px calc(20px + env(safe-area-inset-bottom, 0px));
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
    }

    .btn-capture {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s;
    }
    .btn-capture::after {
      content: '';
      width: 54px; height: 54px;
      border-radius: 50%;
      background: #fff;
    }
    .btn-capture:active { transform: scale(0.93); }
    .btn-capture:disabled { opacity: 0.3; }

    .btn-round {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      transition: background 0.12s;
    }
    .btn-round:active { background: var(--surface); }

    /* Settings button */
    .btn-settings {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      right: 16px;
      z-index: 3;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* Overlay modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .overlay-card h2 { font-size: 17px; font-weight: 700; }
    .overlay-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .overlay-card a { color: var(--accent); }
    .overlay-card input[type="password"],
    .overlay-card input[type="text"] {
      width: 100%;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }
    .overlay-buttons { display: flex; gap: 10px; }
    .overlay-buttons button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .overlay-btn-cancel { background: var(--surface-2); border: 1px solid var(--border); }
    .overlay-btn-save { background: var(--accent); color: #fff; }

    /* PREVIEW */
    #screen-preview { background: #000; }
    #preview-img { flex: 1; width: 100%; object-fit: contain; background: #000; }
    .preview-bar {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: rgba(0,0,0,0.8);
    }
    .btn-secondary {
      flex: 1; padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 15px; font-weight: 600;
    }
    .btn-secondary:active { background: var(--surface); }
    .btn-primary {
      flex: 2; padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      font-size: 15px; font-weight: 700;
      color: #fff;
    }
    .btn-primary:active { opacity: 0.85; }

    /* PROCESSING */
    #screen-processing {
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .music-loader { display: flex; gap: 10px; font-size: 40px; }
    .music-loader span { animation: bounce 0.8s ease-in-out infinite; }
    .music-loader span:nth-child(2) { animation-delay: 0.15s; }
    .music-loader span:nth-child(3) { animation-delay: 0.3s; }
    .music-loader span:nth-child(4) { animation-delay: 0.45s; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-14px); opacity: 1; }
    }
    #processing-msg { color: var(--text-muted); font-size: 14px; }

    /* PLAYER */
    #screen-player { background: var(--bg); overflow-y: auto; }
    .player-header { padding: 20px 20px 12px; border-bottom: 1px solid var(--border); }
    #score-title { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    #score-meta { font-size: 13px; color: var(--text-muted); }

    .note-display-area {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 12px; gap: 14px;
    }
    #note-display {
      font-size: 60px; font-weight: 700;
      color: var(--accent);
      min-height: 68px; line-height: 1;
      text-align: center;
      transition: transform 0.08s;
    }
    #note-roll {
      display: flex; gap: 6px;
      overflow-x: auto; width: 100%;
      padding: 6px 4px;
      scrollbar-width: none;
    }
    #note-roll::-webkit-scrollbar { display: none; }
    .note-chip {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s, transform 0.1s;
    }
    .note-chip.played { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
    .note-chip.active { background: var(--accent); color: #fff; border-color: transparent; transform: scale(1.12); }

    .play-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 16px 20px;
    }
    #btn-play-pause {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--accent); font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
      transition: transform 0.1s;
    }
    #btn-play-pause:active { transform: scale(0.93); }
    .btn-ctrl {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-ctrl:active { background: var(--surface); }

    .divider { height: 1px; background: var(--border); }
    .controls-panel { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .control-row {
      display: grid;
      grid-template-columns: 52px 1fr 40px;
      align-items: center; gap: 10px;
    }
    .control-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .control-value { font-size: 12px; color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; height: 4px; border-radius: 2px; }
    .instrument-row { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px; }
    #instrument-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 14px;
    }
    .btn-text-small {
      align-self: center;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
      background: none;
    }
  </style>
</head>
<body>

<!-- Settings overlay -->
<div id="settings-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2>⚙ Gemini API 設定</h2>
    <p>
      楽譜認識に <strong>Google Gemini API</strong>（無料）を使います。<br>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   MusicXML Parser
═══════════════════════════════════════════════════════ */
function parseMusicXML(xmlString) {
  const doc = new DOMParser().parseFromString(xmlString, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML 解析エラー');

  let bpm = 120, timeBeats = 4, timeBeatType = 4;
  const titleEl = doc.querySelector('work-title, movement-title, credit-words');
  const title = titleEl ? titleEl.textContent.trim() : '';
  const notes = [];

  // パートごとに独立したタイムラインで処理（右手・左手対応）
  const parts = doc.querySelectorAll('part');
  const targets = parts.length > 0 ? parts : [doc]; // フォールバック

  targets.forEach(part => {
    let divisions = 1, cursor = 0, lastDur = 0;

    part.querySelectorAll('measure').forEach(m => {
      const d   = m.querySelector('divisions');         if (d)   divisions    = parseInt(d.textContent);
      const tb  = m.querySelector('time > beats');      if (tb)  timeBeats    = parseInt(tb.textContent);
      const tbt = m.querySelector('time > beat-type');  if (tbt) timeBeatType = parseInt(tbt.textContent);
      const s   = m.querySelector('sound[tempo]');      if (s)   bpm          = parseFloat(s.getAttribute('tempo'));

      let pos = 0;
      m.querySelectorAll('note').forEach(n => {
        const durEl  = n.querySelector('duration');
        const durQN  = durEl ? parseInt(durEl.textContent) / divisions : 0;
        const isRest  = !!n.querySelector('rest');
        const isChord = !!n.querySelector('chord');
        if (isChord) pos -= lastDur;

        if (!isRest) {
          const p = n.querySelector('pitch');
          if (p) {
            const step = p.querySelector('step').textContent.trim();
            const oct  = p.querySelector('octave').textContent.trim();
            const alt  = p.querySelector('alter');
            const a    = alt ? Math.round(parseFloat(alt.textContent)) : 0;
            notes.push({ note: step + (a===1?'#':a===-1?'b':'') + oct, time: cursor + pos, duration: durQN });
            lastDur = durQN;
          }
        } else {
          lastDur = durQN;
        }
        pos += durQN;
      });
      cursor += (timeBeats / timeBeatType) * 4;
    });
  });

  notes.sort((a, b) => a.time - b.time);
  return { notes, bpm, timeBeats, timeBeatType, title };
}

/* ═══════════════════════════════════════════════════════
   Player
═══════════════════════════════════════════════════════ */
class Player {
  constructor() {
    this.synth = null; this.part = null;
    this.notes = []; this.bpm = 120;
    this.volume = 80; this.instrument = 'piano';
    this.onNotePlay = null; this.onEnd = null;
  }

  async init() { await Tone.start(); this._buildSynth(); }

  _buildSynth() {
    if (this.synth) this.synth.dispose();
    const presets = {
      piano:   { oscillator:{type:'triangle'}, envelope:{attack:0.01,decay:0.3,sustain:0.3,release:1.2} },
      marimba: { oscillator:{type:'sine'},     envelope:{attack:0.001,decay:0.4,sustain:0,release:0.4}  },
      flute:   { oscillator:{type:'sine'},     envelope:{attack:0.1,decay:0.1,sustain:0.8,release:0.5}  },
      strings: { oscillator:{type:'sawtooth'}, envelope:{attack:0.3,decay:0.1,sustain:0.8,release:0.8}  },
    };
    this.synth = new Tone.PolySynth(Tone.Synth, presets[this.instrument] || presets.piano).toDestination();
    this._applyVol();
  }

  _applyVol() {
    if (!this.synth) return;
    this.synth.volume.value = this.volume === 0 ? -Infinity : (this.volume / 100) * 40 - 40;
  }

  load(data) { this.notes = data.notes; this.bpm = data.bpm; this._buildPart(); }

  _buildPart() {
    Tone.Transport.cancel(); Tone.Transport.stop(); Tone.Transport.position = 0;
    if (this.part) { this.part.dispose(); this.part = null; }
    if (!this.notes.length) return;

    const spb = 60 / this.bpm;
    const events = this.notes.map((n, i) => [
      n.time * spb,
      { note: n.note, dur: Math.max(n.duration * spb * 0.85, 0.05), idx: i }
    ]);

    this.part = new Tone.Part((time, val) => {
      try { this.synth.triggerAttackRelease(val.note, val.dur, time); } catch(e) {}
      if (this.onNotePlay) Tone.getDraw().schedule(() => this.onNotePlay(val.idx), time);
    }, events);
    this.part.start(0);

    const total = this.notes.reduce((mx, n) => Math.max(mx, n.time + n.duration), 0) * spb;
    Tone.Transport.schedule(t => {
      if (this.onEnd) Tone.getDraw().schedule(() => this.onEnd(), t);
    }, total + 0.3);
  }

  play() { Tone.Transport.start(); }
  pause() { Tone.Transport.pause(); }
  stop() { Tone.Transport.stop(); Tone.Transport.position = 0; }
  isPlaying() { return Tone.Transport.state === 'started'; }
  isPaused()  { return Tone.Transport.state === 'paused'; }

  setTempo(bpm) { const was = this.isPlaying(); this.bpm = bpm; this._buildPart(); if (was) Tone.Transport.start(); }
  setVolume(v) { this.volume = v; this._applyVol(); }
  setInstrument(name) { this.instrument = name; this._buildSynth(); }
  dispose() { this.stop(); if (this.part) this.part.dispose(); if (this.synth) this.synth.dispose(); }
}

/* ═══════════════════════════════════════════════════════
   Camera
═══════════════════════════════════════════════════════ */
class Camera {
  constructor() { this.stream = null; this.video = null; this.canvas = null; }

  async start(video, canvas) {
    this.video = video; this.canvas = canvas;
    const c = { video: { facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} } };
    try { this.stream = await navigator.mediaDevices.getUserMedia(c); }
    catch { this.stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
    video.srcObject = this.stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
  }

  stop() {
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if (this.video) this.video.srcObject = null;
  }

  capture() {
    const v = this.video, c = this.canvas;
    c.width = v.videoWidth || 1280; c.height = v.videoHeight || 720;
    c.getContext('2d').drawImage(v, 0, 0);
    return c.toDataURL('image/jpeg', 0.92);
  }

  static isAvailable() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
}

/* ═══════════════════════════════════════════════════════
   OMR — Gemini Vision API (無料、バックエンド不要)
   APIキー取得: https://aistudio.google.com/app/apikey
═══════════════════════════════════════════════════════ */
async function recognizeScore(dataUrl) {
  const apiKey = localStorage.getItem('gemini_api_key') || '';
  const model  = localStorage.getItem('gemini_model')   || 'gemini-2.0-flash';
  if (!apiKey) { openSettings(); throw new Error('Gemini APIキーを設定してください（⚙ボタン）'); }

  const base64   = dataUrl.split(',')[1];
  const mimeType = dataUrl.split(';')[0].slice(5);

  const prompt = `この楽譜画像をMusicXML（score-partwise バージョン3.1）に完全変換してください。

ルール：
- ピアノ譜の場合、右手（高音部譜表 Treble）と左手（低音部譜表 Bass）を別パートで出力
- 和音は <chord> タグで同時音符を表現
- 全音符・二分音符・四分音符・付点・符点リズムも正確に記述
- 調号（#・♭の数）・拍子記号・テンポを含める
- 全小節を漏れなく出力
- MusicXML（<?xml...>から</score-partwise>まで）のみ返すこと
- コードブロック・説明・前置き・補足は絶対に含めないこと`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64 } }
        ]}],
        generationConfig: { temperature: 0.1, maxOutputTokens: 8192 }
      })
    }
  );

  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }

  const j    = await res.json();
  const text = j.candidates?.[0]?.content?.parts?.[0]?.text ?? '';

  let xml = (text.match(/<\?xml[\s\S]*?<\/score-partwise>/) ||
             text.match(/<score-partwise[\s\S]*?<\/score-partwise>/))?.[0];
  if (!xml) throw new Error('MusicXMLを抽出できませんでした');
  if (!xml.startsWith('<?xml')) xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + xml;
  return xml;
}

/* ═══════════════════════════════════════════════════════
   App controller
═══════════════════════════════════════════════════════ */
const cam    = new Camera();
const player = new Player();
let captured = null;
let parsed   = null;

const $ = id => document.getElementById(id);

function showScreen(name) {
  ['home','preview','processing','player'].forEach(s => {
    $('screen-' + s).hidden = s !== name;
  });
}

function showError(msg) { $('error-msg').textContent = msg; $('error-banner').hidden = false; }
function hideError()    { $('error-banner').hidden = true; }
$('btn-error-close').onclick = hideError;

/* Camera */
async function startCamera() {
  if (!Camera.isAvailable()) { $('btn-capture').disabled = true; return; }
  try { await cam.start($('camera-video'), $('camera-canvas')); }
  catch { showError('カメラへのアクセスが拒否されました。ファイルまたはデモをお使いください。'); $('btn-capture').disabled = true; }
}

$('btn-capture').onclick = () => {
  captured = cam.capture();
  $('preview-img').src = captured;
  cam.stop();
  showScreen('preview');
};

$('btn-upload').onclick = () => $('file-input').click();
$('file-input').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { captured = ev.target.result; $('preview-img').src = captured; cam.stop(); showScreen('preview'); };
  r.readAsDataURL(f);
  $('file-input').value = '';
};

$('btn-demo').onclick = async () => {
  hideError(); showScreen('processing'); $('processing-msg').textContent = 'デモ楽譜を読み込み中…';
  try { await loadScore(await recognizeScoreDemo(), 'デモ（キラキラ星）'); }
  catch(e) { showError('デモ読み込みエラー: ' + e.message); showScreen('home'); }
};

/* Preview */
$('btn-retake').onclick = async () => { showScreen('home'); await startCamera(); };
$('btn-recognize').onclick = async () => {
  hideError(); showScreen('processing'); $('processing-msg').textContent = '楽譜を認識中…';
  try {
    const xml = await recognizeScore(captured);
    await loadScore(xml, '認識された楽譜');
  } catch(e) { showError('認識エラー: ' + e.message); showScreen('preview'); }
};

/* Load score */
async function loadScore(xml, fallback) {
  parsed = parseMusicXML(xml);
  if (!parsed.notes.length) throw new Error('音符が見つかりません');
  await player.init();
  player.load(parsed);
  player.setVolume(parseInt($('volume-slider').value));

  player.onNotePlay = i => {
    $('note-display').textContent = parsed.notes[i]?.note ?? '';
    highlightChip(i);
  };
  player.onEnd = () => {
    $('btn-play-pause').textContent = '▶';
    $('note-display').textContent = '';
    highlightChip(-1);
  };

  $('score-title').textContent = parsed.title || fallback;
  $('score-meta').textContent  = `${parsed.timeBeats}/${parsed.timeBeatType}  ♩=${Math.round(parsed.bpm)}`;
  $('tempo-slider').value      = parsed.bpm;
  $('tempo-display').textContent = Math.round(parsed.bpm);

  buildRoll();
  showScreen('player');
  player.play();
  $('btn-play-pause').textContent = '⏸';
}

/* Note roll */
function buildRoll() {
  const roll = $('note-roll'); roll.innerHTML = '';
  parsed.notes.forEach((n, i) => {
    const s = document.createElement('span');
    s.className = 'note-chip'; s.dataset.i = i;
    s.textContent = n.note.replace(/\d/,'');
    roll.appendChild(s);
  });
}
function highlightChip(active) {
  $('note-roll').querySelectorAll('.note-chip').forEach(c => {
    const i = parseInt(c.dataset.i);
    c.classList.toggle('active', i === active);
    c.classList.toggle('played', i < active);
  });
  const a = $('note-roll').querySelector('.active');
  if (a) a.scrollIntoView({ inline:'center', behavior:'smooth', block:'nearest' });
}

/* Player controls */
$('btn-play-pause').onclick = async () => {
  await Tone.start();
  if (player.isPlaying()) {
    player.pause(); $('btn-play-pause').textContent = '▶';
  } else {
    player.play(); $('btn-play-pause').textContent = '⏸';
  }
};
$('btn-stop').onclick = () => {
  player.stop(); $('btn-play-pause').textContent = '▶';
  $('note-display').textContent = ''; highlightChip(-1);
};
const goHome = async () => { player.stop(); showScreen('home'); await startCamera(); };
$('btn-new-score').onclick = goHome;
$('btn-back').onclick = goHome;

$('tempo-slider').oninput = () => {
  const b = parseInt($('tempo-slider').value);
  $('tempo-display').textContent = b;
  player.setTempo(b);
  $('btn-play-pause').textContent = '▶';
};
$('volume-slider').oninput  = () => player.setVolume(parseInt($('volume-slider').value));
$('instrument-select').onchange = () => player.setInstrument($('instrument-select').value);

/* Settings */
function openSettings() {
  $('gemini-key-input').value = localStorage.getItem('gemini_api_key') || '';
  $('gemini-model-select').value = localStorage.getItem('gemini_model') || 'gemini-2.0-flash';
  $('settings-overlay').hidden = false;
}
$('btn-list-models').onclick = async () => {
  const key = $('gemini-key-input').value.trim() || localStorage.getItem('gemini_api_key') || '';
  if (!key) { $('model-list').textContent = 'APIキーを入力してください'; $('model-list').style.display = 'block'; return; }
  $('model-list').textContent = '取得中…'; $('model-list').style.display = 'block';
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
    const j = await r.json();
    if (!r.ok) { $('model-list').textContent = 'エラー: ' + (j.error?.message || r.status); return; }
    const names = (j.models || [])
      .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
      .map(m => m.name.replace('models/', ''));
    $('model-list').innerHTML = names.length
      ? '✅ 使用可能:<br>' + names.map(n => `<span style="cursor:pointer;color:var(--accent)" onclick="$('gemini-model-select').value='${n}'">${n}</span>`).join('<br>')
      : '対応モデルなし';
  } catch(e) { $('model-list').textContent = 'エラー: ' + e.message; }
};

$('btn-settings').onclick = openSettings;
$('btn-settings-cancel').onclick = () => { $('settings-overlay').hidden = true; };
$('btn-settings-save').onclick = () => {
  const key   = $('gemini-key-input').value.trim();
  const model = $('gemini-model-select').value;
  if (key) localStorage.setItem('gemini_api_key', key);
  else     localStorage.removeItem('gemini_api_key');
  localStorage.setItem('gemini_model', model);
  $('settings-overlay').hidden = true;
};

/* Boot */
(async () => { showScreen('home'); await startCamera(); })();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>楽譜プレイヤー</title>
  <style>
    :root {
      --bg:         #0E0E18;
      --surface:    #181826;
      --surface-2:  #222236;
      --border:     #2E2E4A;
      --text:       #EEEEFF;
      --text-muted: #8888AA;
      --accent:     #7C6AFC;
      --accent-dim: rgba(124,106,252,0.18);
      --accent-glow:rgba(124,106,252,0.35);
      --safe-top:   env(safe-area-inset-top, 0px);
      --safe-bot:   env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
    }
    button { cursor: pointer; font: inherit; border: none; background: none; color: inherit; }
    input[type="range"] { cursor: pointer; accent-color: var(--accent); }
    select { font: inherit; cursor: pointer; }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
      overflow: hidden;
    }
    .screen[hidden] { display: none; }

    /* Error banner */
    #error-banner {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 12px; right: 12px;
      background: #3A1010;
      border: 1px solid #E85454;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      z-index: 100;
      font-size: 13px;
      color: #FFB0B0;
    }
    #error-banner[hidden] { display: none; }
    #error-msg { flex: 1; line-height: 1.5; }
    #btn-error-close { font-size: 18px; color: #FF8888; flex-shrink: 0; margin-top: -1px; }

    /* HOME */
    #screen-home { background: #000; }
    #camera-video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
    #camera-canvas { display: none; }

    .camera-hint {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }

    .capture-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 16px 32px calc(20px + env(safe-area-inset-bottom, 0px));
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
    }

    .btn-capture {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s;
    }
    .btn-capture::after {
      content: '';
      width: 54px; height: 54px;
      border-radius: 50%;
      background: #fff;
    }
    .btn-capture:active { transform: scale(0.93); }
    .btn-capture:disabled { opacity: 0.3; }

    .btn-round {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      transition: background 0.12s;
    }
    .btn-round:active { background: var(--surface); }

    /* Settings button */
    .btn-settings {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      right: 16px;
      z-index: 3;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* Overlay modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .overlay-card h2 { font-size: 17px; font-weight: 700; }
    .overlay-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .overlay-card a { color: var(--accent); }
    .overlay-card input[type="password"],
    .overlay-card input[type="text"] {
      width: 100%;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }
    .overlay-buttons { display: flex; gap: 10px; }
    .overlay-buttons button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .overlay-btn-cancel { background: var(--surface-2); border: 1px solid var(--border); }
    .overlay-btn-save { background: var(--accent); color: #fff; }

    /* PREVIEW */
    #screen-preview { background: #000; }
    #preview-img { flex: 1; width: 100%; object-fit: contain; background: #000; }
    .preview-bar {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: rgba(0,0,0,0.8);
    }
    .btn-secondary {
      flex: 1; padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 15px; font-weight: 600;
    }
    .btn-secondary:active { background: var(--surface); }
    .btn-primary {
      flex: 2; padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      font-size: 15px; font-weight: 700;
      color: #fff;
    }
    .btn-primary:active { opacity: 0.85; }

    /* PROCESSING */
    #screen-processing {
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .music-loader { display: flex; gap: 10px; font-size: 40px; }
    .music-loader span { animation: bounce 0.8s ease-in-out infinite; }
    .music-loader span:nth-child(2) { animation-delay: 0.15s; }
    .music-loader span:nth-child(3) { animation-delay: 0.3s; }
    .music-loader span:nth-child(4) { animation-delay: 0.45s; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-14px); opacity: 1; }
    }
    #processing-msg { color: var(--text-muted); font-size: 14px; }

    /* PLAYER */
    #screen-player { background: var(--bg); overflow-y: auto; }
    .player-header { padding: 20px 20px 12px; border-bottom: 1px solid var(--border); }
    #score-title { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    #score-meta { font-size: 13px; color: var(--text-muted); }

    .note-display-area {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 12px; gap: 14px;
    }
    #note-display {
      font-size: 60px; font-weight: 700;
      color: var(--accent);
      min-height: 68px; line-height: 1;
      text-align: center;
      transition: transform 0.08s;
    }
    #note-roll {
      display: flex; gap: 6px;
      overflow-x: auto; width: 100%;
      padding: 6px 4px;
      scrollbar-width: none;
    }
    #note-roll::-webkit-scrollbar { display: none; }
    .note-chip {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s, transform 0.1s;
    }
    .note-chip.played { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
    .note-chip.active { background: var(--accent); color: #fff; border-color: transparent; transform: scale(1.12); }

    .play-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 16px 20px;
    }
    #btn-play-pause {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--accent); font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
      transition: transform 0.1s;
    }
    #btn-play-pause:active { transform: scale(0.93); }
    .btn-ctrl {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-ctrl:active { background: var(--surface); }

    .divider { height: 1px; background: var(--border); }
    .controls-panel { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .control-row {
      display: grid;
      grid-template-columns: 52px 1fr 40px;
      align-items: center; gap: 10px;
    }
    .control-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .control-value { font-size: 12px; color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; height: 4px; border-radius: 2px; }
    .instrument-row { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px; }
    #instrument-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 14px;
    }
    .btn-text-small {
      align-self: center;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
      background: none;
    }
  </style>
</head>
<body>

<!-- Settings overlay -->
<div id="settings-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2>⚙ Gemini API 設定</h2>
    <p>
      楽譜認識に <strong>Google Gemini API</strong>（無料）を使います。<br>
      APIキー取得：<a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a>
    </p>
    <input type="password" id="gemini-key-input" placeholder="AIza..." autocomplete="off">
    <input type="text" id="gemini-model-select" placeholder="例: gemini-2.0-flash" autocomplete="off">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:13px;color:var(--text-muted);white-space:nowrap;">認識小節数</span>
      <select id="gemini-measures" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-size:14px;">
        <option value="4" selected>4小節（推奨）</option>
        <option value="8">8小節</option>
        <option value="16">16小節</option>
        <option value="32">32小節</option>
      </select>
    </div>
    <button type="button" id="btn-list-models" style="padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text);">利用可能なモデルを確認 →</button>
    <div id="model-list" style="font-size:12px;color:var(--text-muted);line-height:1.8;display:none;max-height:160px;overflow-y:auto;background:var(--surface-2);border-radius:8px;padding:8px 10px;"></div>
    <div class="overlay-buttons">
      <button class="overlay-btn-cancel" id="btn-settings-cancel">キャンセル</button>
      <button class="overlay-btn-save" id="btn-settings-save">保存</button>
    </div>
  </div>
</div>

<div id="error-banner" hidden>
  <span id="error-msg"></span>
  <button id="btn-error-close" aria-label="閉じる">✕</button>
</div>

<!-- HOME -->
<div id="screen-home" class="screen">
  <div class="camera-hint">楽譜をカメラに向けて撮影</div>
  <button id="btn-settings" class="btn-settings" aria-label="設定">⚙</button>
  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="camera-canvas"></canvas>
  <div class="capture-bar">
    <button class="btn-round" id="btn-upload" aria-label="ファイルを選択">🖼️</button>
    <button class="btn-capture" id="btn-capture" aria-label="撮影"></button>
    <button class="btn-round" id="btn-demo" aria-label="デモを再生">♫</button>
  </div>
  <input id="file-input" type="file" accept="image/*" hidden>
</div>

<!-- PREVIEW -->
<div id="screen-preview" class="screen" hidden>
  <img id="preview-img" alt="撮影した楽譜">
  <div class="preview-bar">
    <button class="btn-secondary" id="btn-retake">撮り直す</button>
    <button class="btn-primary"   id="btn-recognize">楽譜を認識</button>
  </div>
</div>

<!-- PROCESSING -->
<div id="screen-processing" class="screen" hidden>
  <div class="music-loader">
    <span>♩</span><span>♪</span><span>♫</span><span>♬</span>
  </div>
  <p id="processing-msg">楽譜を認識中…</p>
</div>

<!-- PLAYER -->
<div id="screen-player" class="screen" hidden>
  <div class="player-header">
    <div id="score-title">—</div>
    <div id="score-meta"></div>
  </div>
  <div class="note-display-area">
    <div id="note-display"></div>
    <div id="note-roll"></div>
  </div>
  <div class="play-controls">
    <button class="btn-ctrl" id="btn-stop"      aria-label="停止">⏹</button>
    <button id="btn-play-pause"                  aria-label="再生">▶</button>
    <button class="btn-ctrl" id="btn-new-score"  aria-label="新しい楽譜">📷</button>
  </div>
  <div class="divider"></div>
  <div class="controls-panel">
    <div class="control-row">
      <span class="control-label">テンポ</span>
      <input type="range" id="tempo-slider" min="40" max="240" value="120" step="1">
      <span class="control-value" id="tempo-display">120</span>
    </div>
    <div class="control-row">
      <span class="control-label">音量</span>
      <input type="range" id="volume-slider" min="0" max="100" value="80" step="1">
      <span class="control-value"></span>
    </div>
    <div class="instrument-row">
      <span class="control-label">音色</span>
      <select id="instrument-select">
        <option value="piano">ピアノ</option>
        <option value="marimba">マリンバ</option>
        <option value="flute">フルート</option>
        <option value="strings">ストリングス</option>
      </select>
    </div>
  </div>
  <button class="btn-text-small" id="btn-back">← 別の楽譜を撮影</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   Score builder
   Gemini が返す JSON（小節ごとの音符リスト）を再生用に展開する。
   t/d は4分音符=1.0、t は小節先頭からの相対位置。
═══════════════════════════════════════════════════════ */

// Tone が受け付ける音名に正規化する。不正なものは null（読み飛ばす）。
function normalizeNote(raw) {
  const m = String(raw ?? '').trim().match(/^([A-Ga-g])([#b]{0,2})(\d)$/);
  if (!m) return null;
  const oct = +m[3];
  if (oct < 0 || oct > 8) return null;
  return m[1].toUpperCase() + m[2] + oct;
}

function buildScore(data) {
  const beats    = Number(data?.beats)    > 0 ? Number(data.beats)    : 4;
  const beatType = Number(data?.beatType) > 0 ? Number(data.beatType) : 4;
  const bpm      = Number(data?.bpm) >= 20 && Number(data.bpm) <= 300 ? Number(data.bpm) : 120;
  const title    = String(data?.title ?? '').trim();

  const barLen = beats * (4 / beatType);   // 1小節の長さ（4分音符単位）
  const notes  = [];

  (Array.isArray(data?.measures) ? data.measures : []).forEach((m, i) => {
    const list = Array.isArray(m?.notes) ? m.notes : [];
    list.forEach(o => {
      const note = normalizeNote(o?.n);
      const t = Number(o?.t), d = Number(o?.d);
      if (!note || !Number.isFinite(t) || !Number.isFinite(d)) return;
      if (t < 0 || d <= 0) return;
      notes.push({ note, time: i * barLen + t, duration: d });
    });
  });

  notes.sort((a, b) => a.time - b.time);
  return { notes, bpm, beats, beatType, title };
}

/* ═══════════════════════════════════════════════════════
   Player
═══════════════════════════════════════════════════════ */
// Salamander Grand Piano（実機録音）。短3度ごとに1音読み、
// 間の音はサンプラーがピッチシフトで補う。
const PIANO_SAMPLES = {
  'C2':'C2.mp3','D#2':'Ds2.mp3','F#2':'Fs2.mp3','A2':'A2.mp3',
  'C3':'C3.mp3','D#3':'Ds3.mp3','F#3':'Fs3.mp3','A3':'A3.mp3',
  'C4':'C4.mp3','D#4':'Ds4.mp3','F#4':'Fs4.mp3','A4':'A4.mp3',
  'C5':'C5.mp3','D#5':'Ds5.mp3','F#5':'Fs5.mp3','A5':'A5.mp3',
  'C6':'C6.mp3',
};
const PIANO_BASE_URL = 'https://tonejs.github.io/audio/salamander/';

class Player {
  constructor() {
    this.voice = null; this.part = null; this.reverb = null;
    this.piano = null;            // 読み込んだサンプラーは使い回す
    this.notes = []; this.bpm = 120;
    this.volume = 80; this.instrument = 'piano';
    this.onNotePlay = null; this.onEnd = null;
  }

  async init(onStatus) {
    // Tone.start() は user gesture が失効していると永久に解決しないため、
    // 3秒で打ち切って UI を固めない（音は次回の ▶ タップで有効になる）
    if (Tone.getContext().state !== 'running') {
      await Promise.race([Tone.start().catch(() => {}), new Promise(r => setTimeout(r, 3000))]);
    }
    // 演奏空間の響き。これが無いとサンプルでも硬く痩せて聞こえる。
    // インパルス応答の生成が終わる前に音を流すと無音になるため必ず待つ
    // （低速な端末で顕在化する）。生成できない場合は響き無しで直結する。
    if (!this.reverb) {
      try {
        const rv = new Tone.Reverb({ decay: 1.8, wet: 0.22 });
        await Promise.race([rv.generate(), new Promise((_, rej) => setTimeout(rej, 5000))]);
        this.reverb = rv.toDestination();
      } catch { this.reverb = null; }
    }
    await this.setInstrument(this.instrument, onStatus);
  }

  // リバーブを作れなかった場合は出力に直結する
  _out(node) { return this.reverb ? node.connect(this.reverb) : node.toDestination(); }

  async setInstrument(name, onStatus) {
    this.instrument = name;
    const voice = name === 'piano'
      ? (await this._loadPiano(onStatus)) ?? this._buildSynth('piano')
      : this._buildSynth(name);

    // 合成音は使い捨て、ピアノのサンプラーは保持する
    if (this.voice && this.voice !== voice && this.voice !== this.piano) this.voice.dispose();
    this.voice = voice;
    this._applyVol();
  }

  // 音源が落とせない環境では null を返し、呼び出し側が合成音に切り替える
  async _loadPiano(onStatus) {
    if (this.piano) return this.piano;
    onStatus?.('ピアノ音源を読み込み中…');
    try {
      const sampler = this._out(new Tone.Sampler({
        urls: PIANO_SAMPLES,
        baseUrl: PIANO_BASE_URL,
        release: 1.4,
      }));

      await Promise.race([
        Tone.loaded().catch(() => {}),
        new Promise(r => setTimeout(r, 25000)),
      ]);
      // Tone.loaded() は取得に失敗しても解決しうるので、実体の有無で判定する
      if (!sampler.loaded) { sampler.dispose(); return null; }

      this.piano = sampler;
      return sampler;
    } catch { return null; }
  }

  _buildSynth(name) {
    const presets = {
      piano:   { oscillator:{type:'triangle'}, envelope:{attack:0.01,decay:0.3,sustain:0.3,release:1.2} },
      marimba: { oscillator:{type:'sine'},     envelope:{attack:0.001,decay:0.4,sustain:0,release:0.4}  },
      flute:   { oscillator:{type:'sine'},     envelope:{attack:0.1,decay:0.1,sustain:0.8,release:0.5}  },
      strings: { oscillator:{type:'sawtooth'}, envelope:{attack:0.3,decay:0.1,sustain:0.8,release:0.8}  },
    };
    return this._out(new Tone.PolySynth(Tone.Synth, presets[name] || presets.piano));
  }

  _applyVol() {
    if (!this.voice) return;
    this.voice.volume.value = this.volume === 0 ? -Infinity : (this.volume / 100) * 40 - 40;
  }

  load(data) { this.notes = data.notes; this.bpm = data.bpm; this._buildPart(); }

  _buildPart() {
    Tone.Transport.cancel(); Tone.Transport.stop(); Tone.Transport.position = 0;
    if (this.part) { this.part.dispose(); this.part = null; }
    if (!this.notes.length) return;

    const spb = 60 / this.bpm;
    // 実際のピアノは鍵を離しても音が伸びる。0.85 で切ると歯切れが良すぎるので
    // やや長めに取り、サンプラー側の release で自然に減衰させる。
    const events = this.notes.map((n, i) => [
      n.time * spb,
      { note: n.note, dur: Math.max(n.duration * spb * 0.95, 0.08), idx: i }
    ]);

    this.part = new Tone.Part((time, val) => {
      try { this.voice.triggerAttackRelease(val.note, val.dur, time); } catch(e) {}
      if (this.onNotePlay) Tone.getDraw().schedule(() => this.onNotePlay(val.idx), time);
    }, events);
    this.part.start(0);

    const total = this.notes.reduce((mx, n) => Math.max(mx, n.time + n.duration), 0) * spb;
    Tone.Transport.schedule(t => {
      if (this.onEnd) Tone.getDraw().schedule(() => this.onEnd(), t);
    }, total + 0.3);
  }

  // 出力が開いているか。閉じたまま Transport を回すと
  // エラーも出ずに無音のまま進んでしまうので、呼び出し側で必ず確認する。
  audioReady() { return Tone.getContext().state === 'running'; }

  play() {
    // gesture が無いと解決しないので待たない
    if (!this.audioReady()) Tone.getContext().resume?.();
    Tone.Transport.start();
  }
  pause() { Tone.Transport.pause(); }
  stop() { Tone.Transport.stop(); Tone.Transport.position = 0; }
  isPlaying() { return Tone.Transport.state === 'started'; }
  isPaused()  { return Tone.Transport.state === 'paused'; }

  setTempo(bpm) { const was = this.isPlaying(); this.bpm = bpm; this._buildPart(); if (was) Tone.Transport.start(); }
  setVolume(v) { this.volume = v; this._applyVol(); }
}

/* ═══════════════════════════════════════════════════════
   Camera
═══════════════════════════════════════════════════════ */
class Camera {
  constructor() { this.stream = null; this.video = null; this.canvas = null; }

  async start(video, canvas) {
    this.video = video; this.canvas = canvas;
    const c = { video: { facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} } };
    try { this.stream = await navigator.mediaDevices.getUserMedia(c); }
    catch { this.stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
    video.srcObject = this.stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
  }

  stop() {
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if (this.video) this.video.srcObject = null;
  }

  capture() {
    const v = this.video, c = this.canvas;
    c.width = v.videoWidth || 1280; c.height = v.videoHeight || 720;
    c.getContext('2d').drawImage(v, 0, 0);
    return c.toDataURL('image/jpeg', 0.92);
  }

  static isAvailable() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
}

/* ═══════════════════════════════════════════════════════
   OMR — Gemini Vision API (無料、バックエンド不要)
   APIキー取得: https://aistudio.google.com/app/apikey
═══════════════════════════════════════════════════════ */
const SCORE_SCHEMA = {
  type: 'OBJECT',
  properties: {
    title:    { type: 'STRING'  },
    bpm:      { type: 'NUMBER'  },
    beats:    { type: 'INTEGER' },
    beatType: { type: 'INTEGER' },
    measures: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          notes: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                n: { type: 'STRING' },   // 音名+オクターブ
                t: { type: 'NUMBER' },   // 小節内の開始位置（4分音符=1）
                d: { type: 'NUMBER' }    // 長さ（4分音符=1）
              },
              required: ['n', 't', 'd']
            }
          }
        },
        required: ['notes']
      }
    }
  },
  required: ['bpm', 'beats', 'beatType', 'measures']
};

// 送信サイズを抑える。1920x1080/q0.92 は base64 で約1MBになり、
// モバイル回線では送信だけで数十秒かかる。
async function shrinkImage(dataUrl, maxSide = 1400, quality = 0.8) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload  = () => res(i);
    i.onerror = () => rej(new Error('画像の読み込みに失敗しました'));
    i.src = dataUrl;
  });
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(img.width  * scale));
  c.height = Math.max(1, Math.round(img.height * scale));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

// サーバー側の一時的な事情によるもの。時間をおけば同じ要求が通る。
const TRANSIENT_STATUS = new Set([429, 500, 502, 503, 504]);

// 混雑（503）・レート制限（429）は数秒待てば解消することが多いので、
// ユーザーに手動で押し直させず自動で再試行する。
async function recognizeScore(rawDataUrl, onRetry) {
  if (!rawDataUrl) throw new Error('画像がありません。撮り直してください');

  const MAX_ATTEMPTS = 3;
  const deadline = Date.now() + 100000;
  let lastErr;

  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      return await callGemini(rawDataUrl);
    } catch (e) {
      lastErr = e;
      if (!e.transient) throw e;
      if (attempt === MAX_ATTEMPTS) break;

      const wait = attempt * 3000;
      // 次の試行が制限時間内に収まらないなら、待たずに諦める
      if (Date.now() + wait + 20000 > deadline) break;
      onRetry?.(attempt + 1);
      await new Promise(r => setTimeout(r, wait));
    }
  }
  if (lastErr?.transient) {
    throw new Error(lastErr.message + '\n\n自動で3回試しましたが混雑が続いています。1〜2分待つか、⚙ で gemini-2.0-flash など軽いモデルに変えてお試しください');
  }
  throw lastErr;
}

async function callGemini(rawDataUrl) {
  const apiKey = localStorage.getItem('gemini_api_key') || '';
  const model  = (localStorage.getItem('gemini_model') || '').trim() || 'gemini-2.0-flash';
  if (!apiKey) { openSettings(); throw new Error('Gemini APIキーを設定してください（⚙ボタン）'); }

  const dataUrl  = await shrinkImage(rawDataUrl);
  const base64   = dataUrl.split(',')[1];
  const mimeType = dataUrl.split(';')[0].slice(5);

  const measures = parseInt(localStorage.getItem('gemini_measures') || '4');
  const prompt = `この楽譜画像を読み取ってください。

- 最初の${measures}小節だけを読むこと（超えないこと）
- measures 配列は小節ごとに1要素
- n = 音名+オクターブ（例: C4, F#5, Bb3）。中央ハ = C4
- t = その小節の先頭からの開始位置。4分音符 = 1.0、小節の先頭 = 0
- d = 音の長さ。4分音符 = 1.0、8分音符 = 0.5、2分音符 = 2.0、全音符 = 4.0
- 和音は t が同じ複数の音として並べる
- ピアノ譜は右手・左手の両方を、同じ小節の notes にまとめて入れる
- 休符は出力しない（音を入れなければ無音になる）
- bpm は楽譜の速度標語から推定（不明なら 100）`;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);

  let res;
  try {
    res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        signal: controller.signal,
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
        contents: [{ parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64 } }
        ]}],
        generationConfig: {
          temperature: 0.1,
          maxOutputTokens: 8192,
          // スキーマを指定すると API 側が構造を保証するため、
          // コードブロック・前置き・タグ欠落といった崩れ方が原理的に起きない
          responseMimeType: 'application/json',
          responseSchema: SCORE_SCHEMA
        }
      })
    });
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('タイムアウト（45秒）。ネットワークを確認してください');
    // 接続断・DNS失敗などは再試行で回復しうる
    e.transient = true;
    throw e;
  }

  if (!res.ok) {
    clearTimeout(timer);
    const body = await res.json().catch(() => ({}));
    const err = new Error(body.error?.message || `HTTP ${res.status}`);
    err.transient = TRANSIENT_STATUS.has(res.status);
    throw err;
  }

  let j;
  try {
    j = await res.json();
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('タイムアウト（45秒）レスポンス読み込み中。再試行してください');
    e.transient = true;
    throw e;
  }
  clearTimeout(timer);
  const candidate = j.candidates?.[0] ?? {};
  const text = candidate.content?.parts?.[0]?.text ?? '';

  if (!text.trim()) {
    const why = candidate.finishReason ?? j.promptFeedback?.blockReason ?? 'UNKNOWN';
    throw new Error(`楽譜を読み取れませんでした (${why})。明るい場所で、楽譜が画面いっぱいに写るように撮影してください`);
  }

  const data = parseScoreJSON(text);
  if (!data) throw new Error('応答を解釈できませんでした。もう一度お試しください');
  return data;
}

// スキーマ指定により通常は素の JSON が返る。
// MAX_TOKENS で途中切断された場合だけ、閉じ括弧を補って復旧する。
function parseScoreJSON(text) {
  const s = text.trim().replace(/^```[a-z]*\n?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(s); } catch {}

  const cut = s.lastIndexOf('}');
  if (cut === -1) return null;
  let t = s.slice(0, cut + 1);

  const open = [];
  let inStr = false, esc = false;
  for (const ch of t) {
    if (esc)            { esc = false; continue; }
    if (ch === '\\')    { esc = true;  continue; }
    if (ch === '"')     { inStr = !inStr; continue; }
    if (inStr)          continue;
    if (ch === '{' || ch === '[') open.push(ch);
    else if (ch === '}' || ch === ']') open.pop();
  }
  while (open.length) t += open.pop() === '{' ? '}' : ']';

  try { return JSON.parse(t); } catch { return null; }
}

async function recognizeScoreDemo() {
  await new Promise(r => setTimeout(r, 800));
  return SAMPLE_SCORE;
}

const SAMPLE_SCORE = (() => {
  // 各小節を "音名[*長さ]" の並びで書く（長さ省略時は4分音符）
  const bars = [
    'C4 C4 G4 G4', 'A4 A4 G4*2', 'F4 F4 E4 E4', 'D4 D4 C4*2',
    'G4 G4 F4 F4', 'E4 E4 D4*2', 'G4 G4 F4 F4', 'E4 E4 D4*2',
    'C4 C4 G4 G4', 'A4 A4 G4*2', 'F4 F4 E4 E4', 'D4 D4 C4*2',
  ];
  return {
    title: 'キラキラ星', bpm: 120, beats: 4, beatType: 4,
    measures: bars.map(bar => {
      let t = 0;
      return { notes: bar.split(' ').map(tok => {
        const [n, d] = tok.split('*');
        const dur = d ? +d : 1;
        const note = { n, t, d: dur };
        t += dur;
        return note;
      })};
    })
  };
})();

/* ═══════════════════════════════════════════════════════
   App controller
═══════════════════════════════════════════════════════ */
const cam    = new Camera();
const player = new Player();
let captured = null;
let parsed   = null;

const $ = id => document.getElementById(id);

function showScreen(name) {
  ['home','preview','processing','player'].forEach(s => {
    $('screen-' + s).hidden = s !== name;
  });
}

function showError(msg) { $('error-msg').textContent = msg; $('error-banner').hidden = false; }
function hideError()    { $('error-banner').hidden = true; }
$('btn-error-close').onclick = hideError;

/* Camera */
async function startCamera() {
  if (!Camera.isAvailable()) { $('btn-capture').disabled = true; return; }
  try { await cam.start($('camera-video'), $('camera-canvas')); }
  catch { showError('カメラへのアクセスが拒否されました。ファイルまたはデモをお使いください。'); $('btn-capture').disabled = true; }
}

$('btn-capture').onclick = () => {
  unlockAudio();   // タップのたびに解錠を試みる（iOS は機会が多いほど確実）
  captured = cam.capture();
  $('preview-img').src = captured;
  cam.stop();
  showScreen('preview');
};

$('btn-upload').onclick = () => { unlockAudio(); $('file-input').click(); };
$('file-input').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { captured = ev.target.result; $('preview-img').src = captured; cam.stop(); showScreen('preview'); };
  r.readAsDataURL(f);
  $('file-input').value = '';
};

// タップ中にのみ AudioContext を起動できる。失効後は Tone.start() が解決しないため
// 必ず gesture ハンドラの先頭で呼ぶ。
async function unlockAudio() {
  try {
    if (Tone.getContext().state !== 'running') {
      await Promise.race([Tone.start(), new Promise(r => setTimeout(r, 1500))]);
    }
    // iOS は resume() だけでは出力経路が開かず、ジェスチャ中に
    // 実際に音を流して初めて開くことがある（無音バッファで十分）。
    const ctx = Tone.getContext().rawContext ?? Tone.getContext();
    const src = ctx.createBufferSource();
    src.buffer = ctx.createBuffer(1, 1, 22050);
    src.connect(ctx.destination);
    src.start(0);
  } catch {}
}

$('btn-demo').onclick = async () => {
  hideError();
  await unlockAudio();
  showScreen('processing'); $('processing-msg').textContent = 'デモ楽譜を読み込み中…';
  try { await loadScore(await recognizeScoreDemo(), 'デモ（キラキラ星）'); }
  catch(e) { showError('デモ読み込みエラー: ' + e.message); showScreen('home'); }
};

/* Preview */
$('btn-retake').onclick = async () => { showScreen('home'); await startCamera(); };
$('btn-recognize').onclick = async () => {
  hideError();

  // タップが有効なうちに AudioContext を解錠する。
  // fetch 完了後は user gesture が失効しており Tone.start() が解決しなくなる。
  await unlockAudio();

  showScreen('processing');

  // 経過秒数を表示（フリーズしているのか通信中なのかを判別できるように）
  let elapsed = 0, label = '楽譜を認識中…';
  $('processing-msg').textContent = `${label} 0秒`;
  const tick = setInterval(() => {
    $('processing-msg').textContent = `${label} ${++elapsed}秒`;
  }, 1000);

  // 認識・読み込みのどこで固まっても必ず UI を解放するハードタイムアウト
  let hardTimer;
  const hardTimeout = new Promise((_, rej) => {
    hardTimer = setTimeout(() => rej(new Error('応答がありません（120秒）。通信環境を変えて再試行してください')), 120000);
  });

  try {
    await Promise.race([
      (async () => {
        const data = await recognizeScore(captured, n => { label = `混雑のため再試行中（${n}回目）…`; });
        await loadScore(data, '認識された楽譜', msg => { label = msg; });
      })(),
      hardTimeout
    ]);
  } catch(e) {
    showError('認識エラー: ' + e.message); showScreen('preview');
  } finally {
    clearInterval(tick);
    clearTimeout(hardTimer);
  }
};

/* Load score */
async function loadScore(data, fallback, onStatus) {
  parsed = buildScore(data);
  if (!parsed.notes.length) throw new Error('音符を読み取れませんでした。楽譜が大きく写るように撮り直してください');
  await player.init(onStatus ?? (msg => { $('processing-msg').textContent = msg; }));
  player.load(parsed);
  player.setVolume(parseInt($('volume-slider').value));

  player.onNotePlay = i => {
    $('note-display').textContent = parsed.notes[i]?.note ?? '';
    highlightChip(i);
  };
  player.onEnd = () => {
    $('btn-play-pause').textContent = '▶';
    $('note-display').textContent = '';
    highlightChip(-1);
  };

  $('score-title').textContent = parsed.title || fallback;
  $('score-meta').textContent  = `${parsed.beats}/${parsed.beatType}  ♩=${Math.round(parsed.bpm)}  ${parsed.notes.length}音`;
  $('tempo-slider').value      = parsed.bpm;
  $('tempo-display').textContent = Math.round(parsed.bpm);

  buildRoll();
  showScreen('player');

  // 認識の待ち時間中に端末が出力を閉じることがある。その状態で再生を始めると
  // 何のエラーも出ないまま無音で進むので、タップを促して確実に鳴らす。
  if (player.audioReady()) {
    player.play();
    $('btn-play-pause').textContent = '⏸';
  } else {
    $('btn-play-pause').textContent = '▶';
    showError('▶ をタップすると再生します。音が出ない場合は端末のマナーモード（消音スイッチ）と音量をご確認ください');
  }
}

/* Note roll */
function buildRoll() {
  const roll = $('note-roll'); roll.innerHTML = '';
  parsed.notes.forEach((n, i) => {
    const s = document.createElement('span');
    s.className = 'note-chip'; s.dataset.i = i;
    s.textContent = n.note.replace(/\d/,'');
    roll.appendChild(s);
  });
}
function highlightChip(active) {
  $('note-roll').querySelectorAll('.note-chip').forEach(c => {
    const i = parseInt(c.dataset.i);
    c.classList.toggle('active', i === active);
    c.classList.toggle('played', i < active);
  });
  const a = $('note-roll').querySelector('.active');
  if (a) a.scrollIntoView({ inline:'center', behavior:'smooth', block:'nearest' });
}

/* Player controls */
$('btn-play-pause').onclick = async () => {
  await unlockAudio();
  if (player.isPlaying()) {
    player.pause(); $('btn-play-pause').textContent = '▶';
  } else {
    player.play(); $('btn-play-pause').textContent = '⏸';
    // タップしても開かないなら端末側の消音が原因
    if (!player.audioReady()) {
      showError('端末が音声を再生できない状態です。マナーモード（消音スイッチ）を解除し、音量を上げてからもう一度お試しください');
    } else hideError();
  }
};
$('btn-stop').onclick = () => {
  player.stop(); $('btn-play-pause').textContent = '▶';
  $('note-display').textContent = ''; highlightChip(-1);
};
const goHome = async () => { player.stop(); showScreen('home'); await startCamera(); };
$('btn-new-score').onclick = goHome;
$('btn-back').onclick = goHome;

$('tempo-slider').oninput = () => {
  const b = parseInt($('tempo-slider').value);
  $('tempo-display').textContent = b;
  player.setTempo(b);
  $('btn-play-pause').textContent = player.isPlaying() ? '⏸' : '▶';
};
$('volume-slider').oninput  = () => player.setVolume(parseInt($('volume-slider').value));
$('instrument-select').onchange = async () => {
  const sel = $('instrument-select');
  sel.disabled = true;
  try { await player.setInstrument(sel.value); }
  catch(e) { showError('音色の切り替えに失敗しました: ' + e.message); }
  finally { sel.disabled = false; }
};

/* Settings */
function openSettings() {
  $('gemini-key-input').value = localStorage.getItem('gemini_api_key') || '';
  $('gemini-model-select').value   = localStorage.getItem('gemini_model')   || 'gemini-2.0-flash';
  $('gemini-measures').value       = localStorage.getItem('gemini_measures') || '4';
  $('settings-overlay').hidden = false;
}
$('btn-list-models').onclick = async () => {
  const key = $('gemini-key-input').value.trim() || localStorage.getItem('gemini_api_key') || '';
  if (!key) { $('model-list').textContent = 'APIキーを入力してください'; $('model-list').style.display = 'block'; return; }
  $('model-list').textContent = '取得中…'; $('model-list').style.display = 'block';
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
    const j = await r.json();
    if (!r.ok) { $('model-list').textContent = 'エラー: ' + (j.error?.message || r.status); return; }
    const names = (j.models || [])
      .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
      .map(m => m.name.replace('models/', ''));
    const box = $('model-list');
    box.textContent = '';
    if (!names.length) { box.textContent = '対応モデルなし'; return; }
    const head = document.createElement('div');
    head.textContent = '✅ 使用可能（タップで選択）:';
    box.appendChild(head);
    names.forEach(n => {
      const row = document.createElement('div');
      row.textContent = n;
      row.style.cssText = 'cursor:pointer;color:var(--accent)';
      row.onclick = () => { $('gemini-model-select').value = n; };
      box.appendChild(row);
    });
  } catch(e) { $('model-list').textContent = 'エラー: ' + e.message; }
};

$('btn-settings').onclick = openSettings;
$('btn-settings-cancel').onclick = () => { $('settings-overlay').hidden = true; };
$('btn-settings-save').onclick = () => {
  const key   = $('gemini-key-input').value.trim();
  const model = $('gemini-model-select').value.trim() || 'gemini-2.0-flash';
  if (key) localStorage.setItem('gemini_api_key', key);
  else     localStorage.removeItem('gemini_api_key');
  localStorage.setItem('gemini_model',   model);
  localStorage.setItem('gemini_measures', $('gemini-measures').value);
  $('settings-overlay').hidden = true;
};

/* Boot */
(async () => { showScreen('home'); await startCamera(); })();
